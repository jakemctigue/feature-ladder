name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q plugins
      - name: Build the Rust audit hook (test_guard_rs compares it with the Python one)
        shell: bash
        run: |
          cargo test --release --locked --manifest-path plugins/feature-ladder/hooks/guard-rs/Cargo.toml
          bash plugins/feature-ladder/hooks/scripts/build_guard.sh
      - name: Run tests
        run: python -m unittest discover -v -s plugins/feature-ladder/tests
      - name: Check security evidence is current
        run: python plugins/feature-ladder/scripts/evidence/generate_evidence.py --check
