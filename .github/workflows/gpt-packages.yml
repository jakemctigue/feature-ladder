name: GPT distributions

on:
  push:
    branches: [main, 'codex/feature-ladder-gpt-packages']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q plugins/feature-ladder-gpt scripts
      - run: python scripts/test_codex.py
      - run: python scripts/package_codex.py
      - run: python scripts/check_archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: feature-ladder-gpt-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
          if-no-files-found: error
